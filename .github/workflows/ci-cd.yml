name: Build and Deploy STB

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: tembak-paket-app/frontend-v2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tembak-paket-app/frontend-v2/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Build Next.js
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm run build

      - name: Package build (.next + version.json)
        # .next/cache = cache webpack (~93% dari artifact, 330MB dari 354MB) dan
        # TIDAK dipakai saat runtime: proyek ini tidak memakai ISR /
        # unstable_cache / export const revalidate. .next/cache dikecualikan supaya
        # payload upload ke STB kecil (51MB -> ~3MB) dan upload tidak putus.
        #
        # public/ TIDAK ikut dipaketkan. Di STB ada 170MB+ aset milik user di
        # public/ (download/, audio/, banner/, apk/) yang tidak boleh ditimpa.
        # Yang dikirim hanya public/version.json supaya UpdateNotifier di
        # frontend mendeteksi versi baru dan memunculkan banner update.
        run: |
          set -euo pipefail
          test -f public/version.json || { echo "::error::public/version.json tidak ada, build script gagal?"; exit 1; }
          test -f .next/BUILD_ID || { echo "::error::.next/BUILD_ID tidak ada, ini bukan server build?"; exit 1; }
          test -d .next/server || { echo "::error::.next/server tidak ada"; exit 1; }
          test -d .next/static || { echo "::error::.next/static tidak ada"; exit 1; }
          tar -czf "$GITHUB_WORKSPACE/frontend-next.tgz" \
            --exclude='.next/cache' \
            --exclude='.next/trace' \
            .next public/version.json
          echo "Artifact size:"
          ls -lh "$GITHUB_WORKSPACE/frontend-next.tgz"
          # Daftar isi ditulis ke file dulu: `tar -tzf | head` membuat tar
          # kena SIGPIPE ("write error", exit 2) dan set -o pipefail
          # menggagalkan step padahal artifact-nya sudah benar.
          tar -tzf "$GITHUB_WORKSPACE/frontend-next.tgz" > "$GITHUB_WORKSPACE/artifact-contents.txt"
          echo "Isi artifact (20 pertama):"
          head -20 "$GITHUB_WORKSPACE/artifact-contents.txt"
          echo "Total member: $(wc -l < "$GITHUB_WORKSPACE/artifact-contents.txt")"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-next
          path: frontend-next.tgz
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-next

      - name: Read expected build metadata
        id: meta
        run: |
          set -euo pipefail
          TARBALL="$GITHUB_WORKSPACE/frontend-next.tgz"
          BUILD_ID="$(tar -xzOf "$TARBALL" .next/BUILD_ID | tr -d '\r\n')"
          VERSION_RAW="$(tar -xzOf "$TARBALL" public/version.json)"
          VERSION_TS="$(printf '%s' "$VERSION_RAW" | python3 -c 'import json,sys; print(json.load(sys.stdin)["timestamp"])')"
          echo "build_id=${BUILD_ID}" >> "$GITHUB_OUTPUT"
          echo "version_ts=${VERSION_TS}" >> "$GITHUB_OUTPUT"
          echo "Expected BUILD_ID=${BUILD_ID} version.json timestamp=${VERSION_TS}"

      - name: Upload Artifact to STB
        env:
          DEPLOY_SECRET: ${{ secrets.AUTO_DEPLOY_SECRET }}
        run: |
          set -euo pipefail
          TARBALL="$GITHUB_WORKSPACE/frontend-next.tgz"
          echo "Uploading $(basename "$TARBALL") ($(stat -c%s "$TARBALL") bytes) ke STB..."
          # Secret dikirim lewat header x-webhook-secret, bukan query string,
          # supaya tidak bocor ke access log server.
          # --http1.1 dipakai karena HTTP/2 dari runner pernah MATI di tengah
          # body besar (PROTOCOL_ERROR -> upload aborted di sisi STB).
          RESP="$(curl -fsS --http1.1 --fail-with-body \
            --connect-timeout 20 --max-time 300 \
            --retry 3 --retry-all-errors --retry-delay 5 --retry-max-time 300 \
            -X POST \
            -H "Content-Type: application/gzip" \
            -H "x-webhook-secret: ${DEPLOY_SECRET}" \
            --data-binary "@${TARBALL}" \
            "https://ry-itsolutionts.web.id/_deploy-artifact")"
          echo "Upload response: ${RESP}"
          # Cek tanpa pipe: `echo ... | grep -q` bikin grep menutup pipe lebih
          # dulu -> echo kena SIGPIPE -> set -o pipefail menggagalkan step
          # walau isinya sudah cocok.
          printf '%s' "${RESP}" > "$GITHUB_WORKSPACE/upload-resp.json"
          grep -F -q '"status":true' "$GITHUB_WORKSPACE/upload-resp.json" \
            || { echo "::error::Upload artifact ditolak server"; exit 1; }

      - name: Trigger STB Deploy & Restart
        env:
          DEPLOY_SECRET: ${{ secrets.AUTO_DEPLOY_SECRET }}
          EXPECT_BUILD_ID: ${{ steps.meta.outputs.build_id }}
        run: |
          set -euo pipefail
          echo "Triggering STB extract & swap .next + restart PM2..."
          RESP="$(curl -fsS --http1.1 --fail-with-body \
            --connect-timeout 20 --max-time 120 \
            --retry 3 --retry-all-errors --retry-delay 5 --retry-max-time 180 \
            -H "x-webhook-secret: ${DEPLOY_SECRET}" \
            "https://ry-itsolutionts.web.id/_deploy")"
          echo "Deploy response: ${RESP}"
          printf '%s' "${RESP}" > "$GITHUB_WORKSPACE/deploy-resp.json"
          grep -F -q '"status":true' "$GITHUB_WORKSPACE/deploy-resp.json" \
            || { echo "::error::Deploy tidak laporan sukses"; exit 1; }
          grep -F -q "${EXPECT_BUILD_ID}" "$GITHUB_WORKSPACE/deploy-resp.json" \
            || { echo "::error::BUILD_ID di server (${RESP}) tidak sama dengan yang dibangun (${EXPECT_BUILD_ID})"; exit 1; }

      - name: Verify live site serves the new build
        env:
          EXPECT_BUILD_ID: ${{ steps.meta.outputs.build_id }}
          EXPECT_VERSION_TS: ${{ steps.meta.outputs.version_ts }}
        run: |
          set -euo pipefail
          # PENTING: /_deploy membalas 200 SEBELUM PM2 di-restart (restart
          # dijadwalkan 2 detik setelah response terkirim). Jadi frontend masih
          # serves build LAMA selama beberapa detik setelah /_deploy sukses.
          # Verifikasi wajib nunggu sampai konten live benar-benar berubah,
          # bukan cuma sampai HTTP 200 (200 itu taillek dari build lama).
          echo "Menunggu frontend STB comeback dengan build baru..."
          LIVE_VERSION=""
          LIVE_HTML=""
          OK=0
          for i in $(seq 1 60); do
            CODE="$(curl -s -o /dev/null -w '%{http_code}' --http1.1 --max-time 15 https://ry-itsolutionts.web.id/ || true)"
            if [ "$CODE" = "200" ]; then
              LIVE_VERSION="$(curl -fsS --http1.1 --max-time 20 "https://ry-itsolutionts.web.id/version.json?t=$(date +%s%N)" || true)"
              LIVE_HTML="$(curl -fsS --http1.1 --max-time 30 https://ry-itsolutionts.web.id/ || true)"
              printf '%s' "${LIVE_VERSION}" > "$GITHUB_WORKSPACE/live-version.json"
              printf '%s' "${LIVE_HTML}" > "$GITHUB_WORKSPACE/live-index.html"
              if grep -F -q "${EXPECT_VERSION_TS}" "$GITHUB_WORKSPACE/live-version.json" \
                && grep -F -q "${EXPECT_BUILD_ID}" "$GITHUB_WORKSPACE/live-index.html"; then
                echo "Frontend sudah serves build baru setelah ${i}x cek (HTTP ${CODE})."
                OK=1
                break
              fi
              echo "Cek ${i}: HTTP ${CODE} tapi masih build lama (version.ts=${LIVE_VERSION:-kosong}), tunggu..."
            else
              echo "Cek ${i}: HTTP ${CODE}, frontend belum comeback..."
            fi
            sleep 5
          done
          [ "$OK" = "1" ] || { echo "::error::Live site tidak menyajikan build baru dalam 300 detik"; exit 1; }

          echo "Live version.json: ${LIVE_VERSION}"
          echo "OK: live site sudah memakai build baru (BUILD_ID ${EXPECT_BUILD_ID})."
