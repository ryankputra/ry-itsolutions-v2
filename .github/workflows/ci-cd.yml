name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'tembak-paket-app/frontend-v2/package-lock.json'

      - name: Install dependencies
        run: npm install
        working-directory: tembak-paket-app/frontend-v2

      - name: Build project
        run: npm run build
        working-directory: tembak-paket-app/frontend-v2

      - name: Archive production artifacts
        uses: actions/upload-artifact@v3
        with:
          name: frontend-build
          path: tembak-paket-app/frontend-v2/.next

      - name: Deploy to STB
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: "tembak-paket-app/frontend-v2/.next/"
          target: "/www/wwwroot/ry-itsolutions/tembak-paket-app/frontend-v2/"

      - name: Restart STB application
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd /www/wwwroot/ry-itsolutions/tembak-paket-app/frontend-v2/
            pm2 restart rystore-frontend
